laravel: '@testbench'

env:
  - APP_NAME="laravel-au demo"
  - APP_ENV=local

providers:
  - EastpointLabs\LaravelAu\LaravelAuServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    web: false
    api: false
    commands: false
    components: false
    factories: false
    views: false
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    - filament:assets
